<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer glow ring -->
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="#334155" stroke-width="3" opacity="0.6" />

  <!-- Shield Shape -->
  <path d="M 256 80 C 330 80 400 110 400 110 C 400 280 290 390 256 420 C 222 390 112 280 112 110 C 112 110 182 80 256 80 Z" 
        fill="url(#shieldGrad)" 
        stroke="#60A5FA" 
        stroke-width="8"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Shield Accent -->
  <path d="M 256 106 C 316 106 376 130 376 130 C 376 268 284 364 256 392 C 228 364 136 268 136 130 C 136 130 196 106 256 106 Z" 
        fill="#0F172A" 
        opacity="0.35" />

  <!-- Pulse / ECG Heartbeat Line -->
  <path d="M 152 256 L 208 256 L 226 210 L 246 298 L 272 176 L 294 316 L 312 256 L 360 256" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Pulse Center Glow Node -->
  <circle cx="272" cy="176" r="10" fill="#FFFFFF" />
</svg>
